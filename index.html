<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
    <title>我的英文學習站</title>
    <style>
        /* 基礎設定 */
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f0ff8f; 
            margin: 0;
        }

        /* 首頁樣式 */
        #home-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            background-color: #87CEEB;
            border-radius: 50px;
            margin: 20px;
        }

        .main-title {
            background-color: white;
            font-size: 60px;
            color: #2c3e50;
            padding: 10px 30px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 25px;
            color: purple;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .btn {
            background-color: #e67e22;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
        }

        .btn:hover {
            background-color: #d35400;
            transform: scale(1.1);
        }

        /* 卡片頁面樣式 */
        .card { 
            background: white; 
            border-radius: 50px; 
            padding: 40px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            width: 80%;
            max-width: 400px;
            margin: 50px auto;
        }

        /* 翻轉動畫 */
        .flip-container {
            perspective: 1000px;
            display: inline-block;
            margin-top: 20px;
        }

        .flipper {
            width: 200px;
            height: 100px;
            position: relative;
            transition: 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flipper.is-flipped {
            transform: rotateY(180deg);
        }

        .front, .back {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            font-size: 28px;
        }

        .front { background: #3498db; z-index: 2; }
        .back { background: #2ecc71; transform: rotateY(180deg); }

        #hello-text {
            color: green;
            font-size: 40px;
            font-weight: bold;
            font-family: 'Noto Sans TC', sans-serif;
        }
    </style>
</head>
<body>

    <p id="hello-text">Hello! 你好</p>

    <div id="home-page">
        <h1 class="main-title">偷懶快速學英文</h1>
        <p class="subtitle">隨便翻譯翻都能背起來....1個單字</p>
        <button class="btn" onclick="startLearning()">開始學習</button>
        <button class="btn" style="background-color: #95a5a6;" onclick="exitout()">放棄退出</button>
    </div>

    <div id="card-page" style="display: none;">
        <div class="card">
            <h1 style="color: red; font-size: 50px;">banana</h1>
            <div class="flip-container">
                <div class="flipper" id="myButton" onclick="flipIt()">
                    <div class="front">點我翻譯</div>
                    <div class="back">香蕉 (n.)</div>
                </div>
            </div>
            <br>
            <button class="btn" onclick="goToHome()" style="background-color: #7f8c8d; margin-top: 30px;">
                返回首頁
            </button>
        </div>
    </div>

    <script>
        function startLearning() {
            document.getElementById("home-page").style.display = "none";
            document.getElementById("card-page").style.display = "block";
        }

        function goToHome() {
            document.getElementById("card-page").style.display = "none";
            document.getElementById("home-page").style.display = "flex";
        }

        function flipIt() {
            document.getElementById("myButton").classList.toggle("is-flipped");
        }

        function exitout() {
            if (confirm("真的要離開嗎？")) {
                window.location.href = "https://www.google.com";
            }
        }
    </script>
</body>
</html>
